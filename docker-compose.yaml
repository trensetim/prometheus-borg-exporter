version: '3.5'

services:
  prometheus-backup-exporter:
    container_name: prometheus-backup-exporter
    image: docker-registry.timtrense.com/tim/prometheus-borg-exporter:latest
    restart: unless-stopped
    ports:
      - "9401:9401"
    environment:
      BORG_REPOSITORY: ssh://backup-user@my-remote-server:22/./my-remote-repository
      BORG_RSH: ssh -i /home/prometheus-borg-exporter/.ssh/id_rsa
    volumes:
      - .ssh:/home/prometheus-borg-exporter/.ssh
    #   - "./my-local-repository:/var/lib/borg/repo:rw"
