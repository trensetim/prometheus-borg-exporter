image: docker:28-cli

before_script:
    - >
        printf '%s' "$CI_REGISTRY_PASSWORD" |
        docker login
        --username "$CI_REGISTRY_USER"
        --password-stdin "$CI_REGISTRY"

build_image:
    tags:
        - docker
    script:
        - |
            set -- --tag "$CI_REGISTRY_IMAGE:latest"
            if [ -n "$CI_COMMIT_TAG" ]; then
                set -- "$@" --tag "$CI_REGISTRY_IMAGE:$CI_COMMIT_TAG"
            fi
            docker buildx build \
                --platform linux/amd64,linux/arm64 \
                --file src/build/docker/Dockerfile \
                "$@" \
                --push .
